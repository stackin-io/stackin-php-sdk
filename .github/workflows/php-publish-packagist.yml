name: 📦 Package Packagist

# Packagist resolves straight from the tag, so this does not upload a
# build — it writes LAST_VERSION from the tag, runs the same tests and
# lint the branch runs, and then tells Packagist to look.
#
# It used to *verify* LAST_VERSION instead, which made every release a
# two-step ritual — bump, push, then tag — and three releases in a row
# failed because the tag came first. Deriving it from the tag is what
# the Python SDK does, and there is one source of truth either way.
#
# The commit lands after the tag, so the tag itself still carries the
# previous LAST_VERSION. Composer reads the version from the tag, never
# from that file, so the file is a record of the last release rather
# than of the tagged tree.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-version:
    name: Write LAST_VERSION from the tag
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 🔍 Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Packagist needs a semver tag prefixed with v, got $TAG."
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag $TAG -> ${TAG#v}"

      - name: 📝 Write LAST_VERSION
        run: echo "${{ steps.version.outputs.version }}" > LAST_VERSION

      - name: 💾 Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add LAST_VERSION

          if git diff --staged --quiet; then
            echo "LAST_VERSION already says this version"
            exit 0
          fi

          git commit -m "📦 PKG: Update version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  code-quality:
    name: Code Quality Checks
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  integration:
    name: Issue a real document
    needs: [update-version, test, code-quality]
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  notify-packagist:
    name: Notify Packagist
    needs: [update-version, test, code-quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Trigger Packagist update
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/stackin-io/stackin-php-sdk"}}'
