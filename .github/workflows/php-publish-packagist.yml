name: 📦 Package Packagist

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to publish, without the v prefix
        required: true
        type: string
      registry:
        description: packagist
        required: true
        type: choice
        options: [packagist]

permissions:
  contents: read

jobs:
  release-tag:
    name: Check the release tag
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Semver tag
        run: |
          if ! printf '%s' "v${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Packagist needs a semver tag prefixed with v, got v${{ inputs.version }}."
            exit 1
          fi

      - name: 📥 Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

  test:
    name: Run Tests
    needs: [release-tag]
    uses: ./.github/workflows/test.yml
    secrets: inherit

  code-quality:
    name: Code Quality Checks
    needs: [release-tag]
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  integration:
    name: Issue a real document
    needs: [test, code-quality]
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  notify-packagist:
    name: Notify Packagist
    needs: [test, code-quality, integration]
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Trigger Packagist update
        run: |
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}" \
            -d '{"repository":{"url":"https://github.com/stackin-io/stackin-php-sdk"}}'
