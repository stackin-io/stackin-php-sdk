name: 🧾 Integration

on:
  workflow_call:
  workflow_dispatch:

jobs:
  integration:
    name: Issue a real document
    runs-on: ubuntu-latest
    environment: workflow

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: "8.3"


      - name: 🧾 Issue an NFS-e through the published surface
        env:
          STACKIN_API_KEY: ${{ secrets.STACKIN_API_KEY }}
        run: php examples/nfse/basic.php

      - name: 📋 Summary
        if: always()
        run: |
          echo "### Integration ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "examples/nfse/basic.php against the live API" >> "$GITHUB_STEP_SUMMARY"
